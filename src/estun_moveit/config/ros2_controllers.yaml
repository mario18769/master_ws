# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # hand_controller:
    #   type: parallel_gripper_action_controller/GripperActionController      

hand_controller:
  ros__parameters:
    joints:
      - joint_gripper_base_finger_base_left
      - joint_gripper_base_finger_base_right
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    constraints:
      goal_time: 10.0
      stopped_velocity_tolerance: 0.005
      joint_gripper_base_finger_base_left: {trajectory: 0.0, goal: 0.06}
      joint_gripper_base_finger_base_right: {trajectory: 0.0, goal: 0.06}
    # gains:
    #   gains.joint_gripper_base_finger_base_left.p: 0.4
    #   gains.joint_gripper_base_finger_base_left.i: 0.4
    #   gains.joint_gripper_base_finger_base_left.d: 0.4

    #   gains.joint_gripper_base_finger_base_right.p: 0.4
    #   gains.joint_gripper_base_finger_base_right.i: 0.4
    #   gains.joint_gripper_base_finger_base_right.d: 0.4

