# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

      

hand_controller:
  ros__parameters:
    joints:
      - joint_gripper_base_finger_base_left
      - joint_gripper_base_finger_base_right
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    # allow_nonzero_velocity_at_trajectory_end: true
    # action_monitor_rate: 20.0
    # allow_stalling: true
    # goal_tolerance: 0.01
    # max_effort_interface: joint_gripper_base_finger_base_left/effort
    # max_effort: 1300.0
    # stall_timeout: 0.05
    # stall_velocity_threshold: 0.001


arm_controller:
  ros__parameters:
    joints:
      - joint_base_00
      - joint_00_01
      - joint_01_02
      - joint_02_03
      - joint_03_04
      - joint_04_05
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    allow_nonzero_velocity_at_trajectory_end: true

    action_monitor_rate: 20.0

    allow_partial_joints_goal: false
    interpolate_from_desired_state: false
    allow_trajectory_replacement: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 10.0
