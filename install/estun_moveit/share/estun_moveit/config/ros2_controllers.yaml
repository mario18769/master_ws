      #   goal: 0.05

      # joint_01_02:
      #   trajectory: 0.05
      #   goal: 0.05

      # joint_02_03:
      #   trajectory: 0.05
      #   goal: 0.05

      # joint_03_04:
      #   trajectory: 0.05
      #   goal: 0.05

      # joint_04_05:
      #   trajectory: 0.05
      #   goal: 0.05

